# Local "production-like" stack:  docker compose up --build   →  http://localhost:8080
name: arxiv-classifier

x-app: &app
  image: arxiv-classifier:latest   # one image for all Python services, built once
  build: .
  env_file: .env   # API keys (never baked into the image)
  environment:
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: postgresql://arxiv:arxiv@postgres:5432/arxiv
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: arxiv, POSTGRES_PASSWORD: arxiv, POSTGRES_DB: arxiv }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5433:5432"]  # 5433 on the host: 5432 is often taken by a local Postgres
    healthcheck: { test: pg_isready -U arxiv, interval: 2s, retries: 20 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: redis-cli ping, interval: 2s, retries: 20 }

  ingestor:
    <<: *app
    command: python -m arxiv_classifier.ingestor

  worker:
    <<: *app
    command: python -m arxiv_classifier.worker
    deploy: { replicas: 2 }

  api:
    <<: *app
    healthcheck: { test: "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\"", interval: 5s }

  web:
    image: arxiv-classifier-web:latest
    build: ./web
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
