apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: arxiv-classifier
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: arxiv-classifier-config }
            - secretRef: { name: arxiv-classifier-keys }   # API keys: make k8s-secrets (from your .env)
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL   # $(VAR) is expanded by Kubernetes from the variable above
              value: postgresql://arxiv:$(POSTGRES_PASSWORD)@postgres:5432/arxiv
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false }
          # Readiness: send traffic only once Postgres + Redis answer. Liveness: restart if it hangs.
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports: [{ port: 8000 }]
