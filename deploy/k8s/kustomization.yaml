# kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arxiv-classifier

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - ingestor.yaml
  - worker.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml

# Non-secret settings, shared by every Python pod.
configMapGenerator:
  - name: arxiv-classifier-config
    literals:
      - REDIS_URL=redis://redis:6379/0
      - POLL_MINUTES=15
      - LLM_PROVIDER=claude          # or gemini
      - LLM_SAMPLE_RATE=1.0
      - WORKER_CONCURRENCY=8

# Demo database password. On a real server, create this Secret by hand instead of committing it.
secretGenerator:
  - name: postgres
    literals:
      - POSTGRES_PASSWORD=arxiv

# Point these at a registry (e.g. ghcr.io/you/arxiv-classifier) to deploy on a remote cluster.
images:
  - name: arxiv-classifier
    newTag: latest
  - name: arxiv-classifier-web
    newTag: latest
