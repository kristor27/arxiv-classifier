# A CronJob: Kubernetes starts a pod every 5 minutes, it checks reverts and exits.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reverts
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reverts
              image: wikipulse
              imagePullPolicy: IfNotPresent
              command: [python, -m, wikipulse.reverts]
              envFrom:
                - configMapRef: { name: wikipulse-config }
                - secretRef: { name: wikipulse-keys }   # API keys: make k8s-secrets (from your .env)
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD } }
                - name: DATABASE_URL   # $(VAR) is expanded by Kubernetes from the variable above
                  value: postgresql://wikipulse:$(POSTGRES_PASSWORD)@postgres:5432/wikipulse
              securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false }
              resources:
                requests: { cpu: 50m, memory: 96Mi }
                limits: { memory: 256Mi }
