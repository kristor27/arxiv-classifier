# Exactly one replica, and Recreate: two ingestors at once would queue every edit twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: ingestor }
  template:
    metadata:
      labels: { app: ingestor }
    spec:
      containers:
        - name: ingestor
          image: arxiv-classifier
          imagePullPolicy: IfNotPresent
          command: [python, -m, arxiv_classifier.ingestor]
          envFrom:
            - configMapRef: { name: arxiv-classifier-config }
            - secretRef: { name: arxiv-classifier-keys }   # API keys: make k8s-secrets (from your .env)
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL   # $(VAR) is expanded by Kubernetes from the variable above
              value: postgresql://arxiv:$(POSTGRES_PASSWORD)@postgres:5432/arxiv
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
